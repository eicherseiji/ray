group: runtime core tests
depends_on:
  - forge
  - ray-core-build
  - ray-dashboard-build
steps:
  - label: ":ray: core: runtime tests"
    instance_type: medium
    commands:
      - bazel run //ci/ray_ci:test_in_docker -- //python/ray/anyscale/tests/... core
        --python-version 3.10 --build-name corebuild-py3.10
    depends_on: corebuild-multipy
    job_env: forge
    tags:
      - python
      - core-turbo
