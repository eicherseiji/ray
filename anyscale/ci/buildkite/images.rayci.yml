# Build images for rayturbo
group: rayturbo images
steps:
  - name: slim-cpubase
    label: "wanda: slim.py{{matrix}}.cpu.base"
    tags:
      - python_dependencies
      - docker
    wanda: anyscale/ci/docker/anyscale.cpu.base.wanda.yaml
    matrix:
      - "3.9"
      - "3.10"
      - "3.11"
      - "3.12"
    env:
      PYTHON_VERSION: "{{matrix}}"

  - name: slim-cudabase
    label: "wanda: slim.py{{matrix.python}}.cuda{{matrix.cuda}}.base"
    tags:
      - python_dependencies
      - docker
    wanda: anyscale/ci/docker/anyscale.cuda.base.wanda.yaml
    matrix:
      setup:
        python:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
        cuda:
          - "11.7.1"
          - "11.8.0"
          - "12.1.1"
          - "12.3.2"
          - "12.4.1"
          - "12.5.1"
          - "12.6.3"
          - "12.8.1"
    env:
      PYTHON_VERSION: "{{matrix.python}}"
      CUDA_VERSION: "{{matrix.cuda}}"

  - label: ":tapioca: go download helper"
    key: rayturbo-helper
    instance_type: small
    commands:
      - bash anyscale/go/build-on-buildkite.sh
    depends_on:
      - forge
    job_env: forge
    tags:
      - gotools

  - label: ":tapioca: rayturbo py{{matrix}} wheel amd64"
    key: rayturbo-wheels
    commands:
      - bazel run //ci/ray_ci:build_in_docker -- wheel --python-version {{matrix}}
      - bash anyscale/ci/upload-wheels.sh
    instance_type: medium
    depends_on:
      - manylinux
      - forge
    job_env: forge
    tags: docker
    matrix:
      - "3.9"
      - "3.10"
      - "3.11"
      - "3.12"

  - label: ":tapioca: rayturbo py{{matrix}} wheel aarch64"
    key: rayturbo-wheels-aarch64
    commands:
      - bazel run //ci/ray_ci:build_in_docker -- wheel --architecture aarch64 --python-version {{matrix}}
      - bash anyscale/ci/upload-wheels.sh
    instance_type: medium-arm64
    depends_on:
      - manylinux-aarch64
      - forge-aarch64
    job_env: forge-aarch64
    tags: docker
    matrix:
      - "3.9"
      - "3.10"
      - "3.11"
      - "3.12"

  - label: "Check ray wheels"
    key: check-ray-wheels
    commands:
      - source anyscale/ci/setup-env.sh
      - bazel run //anyscale/ci:check_wheels_exist_s3 -- --branch="$$UPSTREAM_BRANCH" --ray_version="$$RAY_VERSION"  --commit_hash="$(cat .UPSTREAM)"
    depends_on:
      - forge

  - label: ":tapioca: rayturbo py{{matrix.py}} {{matrix.base}} image (amd64)"
    key: rayturbo-image
    tags: docker
    commands:
      - export LAYER_TYPE=base-extra
      - export SKIP_ANYSCALE_LAYER=1
      - bash anyscale/ci/build-ray-image.sh {{matrix.py}} {{matrix.base}}
    instance_type: medium
    depends_on:
      - rayturbo-wheels
      - rayturbo-helper
      - raycpubaseextra
      - raycudabaseextra
      - check-ray-wheels
    job_env: forge
    mount_buildkite_agent: true
    matrix:
      setup:
        py:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
        base:
          - "cpu"
          - "cu11.7.1-cudnn8"
          - "cu11.8.0-cudnn8"
          - "cu12.1.1-cudnn8"
          - "cu12.3.2-cudnn9"
          - "cu12.4.1-cudnn"
          - "cu12.5.1-cudnn"
          - "cu12.6.3-cudnn"
          - "cu12.8.1-cudnn"

  - label: ":tapioca: rayturbo py{{matrix.py}} {{matrix.base}} image (aarch64)"
    key: rayturbo-image-aarch64
    tags: docker
    commands:
      - export LAYER_TYPE=base-extra
      - export SKIP_ANYSCALE_LAYER=1
      - bash anyscale/ci/build-ray-image.sh {{matrix.py}} {{matrix.base}}
    instance_type: medium-arm64
    depends_on:
      - rayturbo-wheels-aarch64
      - rayturbo-helper
      - raycpubaseextra-aarch64
      - raycudabaseextra-aarch64
      - check-ray-wheels
    job_env: forge-aarch64
    mount_buildkite_agent: true
    matrix:
      setup:
        py:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
        base:
          - "cpu"
          - "cu11.7.1-cudnn8"
          - "cu11.8.0-cudnn8"
          - "cu12.1.1-cudnn8"
          - "cu12.3.2-cudnn9"
          - "cu12.4.1-cudnn"
          - "cu12.5.1-cudnn"
          - "cu12.6.3-cudnn"
          - "cu12.8.1-cudnn"

  - label: ":tapioca: slim rayturbo py{{matrix.py}} {{matrix.base}} image"
    key: rayturbo-slim-image
    tags: docker
    commands:
      - bash anyscale/ci/build-ray-image.sh {{matrix.py}} {{matrix.base}} ray 1
    instance_type: medium
    depends_on:
      - rayturbo-wheels
      - rayturbo-helper
      - slim-cpubase
      - slim-cudabase
      - check-ray-wheels
    job_env: forge
    mount_buildkite_agent: true
    matrix:
      setup:
        py:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
        base:
          - "cpu"
          - "cu11.7.1"
          - "cu11.8.0"
          - "cu12.1.1"
          - "cu12.3.2"
          - "cu12.4.1"
          - "cu12.5.1"
          - "cu12.6.3"
          - "cu12.8.1"

  - label: ":tapioca: rayturbo llm py{{matrix.py}} {{matrix.base}} image"
    key: rayturbo-llm-image
    tags: docker
    commands:
      - export LAYER_TYPE=base-extra
      - export SKIP_ANYSCALE_LAYER=1
      - bash anyscale/ci/build-ray-image.sh {{matrix.py}} {{matrix.base}} ray-llm
    instance_type: medium
    depends_on:
      - rayturbo-wheels
      - rayturbo-helper
      - ray-llmbaseextra
      - check-ray-wheels
    job_env: forge
    mount_buildkite_agent: true
    matrix:
      setup:
        py:
          - "3.11"
        base:
          - "cu12.8.1-cudnn"

  - label: ":tapioca: rayturbo ml py{{matrix.py}} {{matrix.base}} image"
    key: rayturbo-ml-image
    tags: docker
    commands:
      - export LAYER_TYPE=base-extra
      - export SKIP_ANYSCALE_LAYER=1
      - bash anyscale/ci/build-ray-image.sh {{matrix.py}} {{matrix.base}} ray-ml
    instance_type: medium
    depends_on:
      - rayturbo-wheels
      - rayturbo-helper
      - ray-mlcpubaseextra
      - ray-mlcudabaseextra
      - check-ray-wheels
    job_env: forge
    mount_buildkite_agent: true
    matrix:
      setup:
        py:
          - "3.9"
          - "3.10"
          - "3.11"
        base:
          - "cpu"
          - "cu12.1.1-cudnn8"

  - label: ":tapioca: check rayturbo site package tarball"
    depends_on:
      - rayturbo-image
      - rayturbo-image-aarch64
      - rayturbo-llm-image
      - rayturbo-slim-image
      - rayturbo-ml-image
    key: check-rayturbo-site-pkg
    tags: docker
    commands:
      - bash anyscale/ci/check-ray-site-pkg.sh
    instance_type: small
    job_env: forge

  # We skip production and predeploy; will copy them on final image
  # building. We need to copy to staging for release tests to run.
  - label: ":tapioca: upload rayturbo artifacts to {{matrix}}"
    key: upload-rayturbo-staging
    depends_on: check-rayturbo-site-pkg
    tags: docker
    commands:
      - bash anyscale/ci/upload-rayturbo-artifacts.sh {{matrix}}
    instance_type: small
    job_env: forge
    matrix:
      - development
      - staging

  - label: ":tapioca: upload rayturbo artifacts to {{matrix}}"
    if: build.env("RUNTIME_BUILD_ALL") == "true"
    key: upload-rayturbo-prod
    depends_on: check-rayturbo-site-pkg
    tags: docker
    commands:
      - bash anyscale/ci/upload-rayturbo-artifacts.sh {{matrix}}
    instance_type: small
    job_env: forge
    matrix:
      - predeploy
      - production
