group: runtime serve tests
steps:
  - label: ":ray-serve: serve: runtime tests"
    parallelism: 2
    instance_type: medium
    commands:
      - bazel run //ci/ray_ci:test_in_docker -- //python/ray/anyscale/serve/... serve
        --workers "$${BUILDKITE_PARALLEL_JOB_COUNT}" --worker-id "$${BUILDKITE_PARALLEL_JOB}" --parallelism-per-worker 3
        --except-tags direct_ingress
    depends_on: servebuild
    job_env: forge
    tags:
      - serve

  - label: ":ray-serve: serve: gRPC tests"
    parallelism: 2
    instance_type: large
    commands:
      - bazel run //ci/ray_ci:test_in_docker -- //python/ray/serve/... //python/ray/tests/...  serve
        --except-tags post_wheel_build,gpu,ha_integration
        --workers "$${BUILDKITE_PARALLEL_JOB_COUNT}" --worker-id "$${BUILDKITE_PARALLEL_JOB}" --parallelism-per-worker 3
        --build-name servebuild --test-env=ANYSCALE_RAY_SERVE_USE_GRPC_BY_DEFAULT=1
        --test-env=ANYSCALE_RAY_SERVE_GRPC_RUN_PROXY_ROUTER_SEPARATE_LOOP=0
        --test-env=ANYSCALE_RAY_SERVE_REPLICA_GRPC_MAX_MESSAGE_LENGTH=10500000
    depends_on: servebuild
    job_env: forge
    tags:
      - serve

  - label: ":ray-serve: serve: direct ingress tests"
    instance_type: large
    commands:
      - bazel run //ci/ray_ci:test_in_docker -- $(cat anyscale/ci/buildkite/serve_di_test_names.txt) serve
        --workers "$${BUILDKITE_PARALLEL_JOB_COUNT}" --worker-id "$${BUILDKITE_PARALLEL_JOB}" --parallelism-per-worker 3
        --build-name servebuild --test-env=ANYSCALE_RAY_SERVE_ENABLE_DIRECT_INGRESS=1
        --test-env=ANYSCALE_RAY_SERVE_DIRECT_INGRESS_MIN_DRAINING_PERIOD_S=0.01
        --test-env=RAY_SERVE_DISABLE_SHUTTING_DOWN_INGRESS_REPLICAS_FORCEFULLY=0
    depends_on: servebuild
    job_env: forge
    tags:
      - serve

  - label: ":ray-serve: serve: direct ingress tests (same loop)"
    instance_type: large
    commands:
      - bazel run //ci/ray_ci:test_in_docker -- $(cat anyscale/ci/buildkite/serve_di_test_names.txt) serve
        --workers "$${BUILDKITE_PARALLEL_JOB_COUNT}" --worker-id "$${BUILDKITE_PARALLEL_JOB}" --parallelism-per-worker 3
        --build-name servebuild --test-env=ANYSCALE_RAY_SERVE_ENABLE_DIRECT_INGRESS=1
        --test-env=ANYSCALE_RAY_SERVE_DIRECT_INGRESS_MIN_DRAINING_PERIOD_S=0.01
        --test-env=RAY_SERVE_RUN_USER_CODE_IN_SEPARATE_THREAD=0
        --test-env=RAY_SERVE_DISABLE_SHUTTING_DOWN_INGRESS_REPLICAS_FORCEFULLY=0
    depends_on: servebuild
    job_env: forge
    tags:
      - serve

  - label: ":ray-serve: serve: HAProxy tests"
    instance_type: medium
    commands:
      - bazel run //ci/ray_ci:test_in_docker -- //python/ray/anyscale/serve:tests/test_haproxy serve
        --build-name servehaproxybuild
        --test-env=ANYSCALE_RAY_SERVE_ENABLE_HA_PROXY=1
        --test-env=ANYSCALE_RAY_SERVE_DIRECT_INGRESS_MIN_DRAINING_PERIOD_S=0.01
    depends_on: servehaproxybuild
    job_env: forge
    tags:
      - serve
