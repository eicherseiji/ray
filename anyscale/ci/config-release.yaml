name: ray-release
artifacts_bucket: bk-premerge-first-jawfish-artifacts
ci_temp: s3://bk-premerge-first-jawfish-artifacts/tmp/runtime/
ci_work_repo: 830883877497.dkr.ecr.us-west-2.amazonaws.com/anyscale/ci-temp
forge_prefix: cr.ray.io/rayproject/
builder_queues:
  builder: rayturbo_builder_queue
runner_queues:
  release: rayturbo_small_queue
  release-medium: rayturbo_medium_queue
  default: rayturbo_small_queue
  small: rayturbo_small_queue
  medium: rayturbo_medium_queue
buildkite_dirs:
  - .buildkite/release
  - anyscale/ci/buildkite/release
env:
  BUILDKITE_BAZEL_CACHE_URL: https://bk-premerge-first-jawfish-artifacts.s3.us-west-2.amazonaws.com/bazel/cache/runtime
  RAYCI_SKIP_UPLOAD: "true"
  RAYCI_DISABLE_CPP_WHEEL: "true"
  RAYCI_DISABLE_JAVA: "true"
  RAYCI_GLOBAL_CONFIG: "ci/ray_ci/runtime_config.yaml"
hook_env_keys:
  - RAYCI_CHECKOUT_DIR
skip_tags:
  - disabled
  - oss
  - skip-on-release-tests
build_env_keys:
  - AUTOMATIC
  - RELEASE_FREQUENCY
docker_plugin:
  allow_mount_buildkite_agent: true
