###############
# Serve tests
###############

- name: serve_node_draining
  group: Serve tests
  working_dir: anyscale/serve_tests

  frequency: nightly
  team: serve

  cluster:
    byod: {}
    cluster_compute: compute_tpl_8_cpu_autoscaling.yaml

  run:
    timeout: 7200
    long_running: false
    script: python workloads/serve_node_draining.py

  alert: default

  variations:
    - __suffix__: aws
    - __suffix__: gce
      env: gce
      frequency: manual
      cluster:
        cluster_compute: compute_tpl_8_cpu_autoscaling_gce.yaml

- name: safetensors_integration_tests_on_gpu
  group: Serve tests
  working_dir: //python/ray/anyscale/safetensors/tests/integration

  frequency: nightly
  team: serve

  cluster:
    byod:
      type: gpu
    cluster_compute: gpu_test_compute_aws.yaml

  run:
    timeout: 1200
    script: TEST_ON_CUDA=1 pytest -vs test_dummy_model.py

- name: safetensors_load_file_benchmark
  group: Serve tests
  working_dir: //python/ray/anyscale/safetensors/tests/benchmarks

  frequency: nightly
  team: serve

  cluster:
    byod:
      type: gpu

  run:
    timeout: 1200

  variations:
    - __suffix__: cpu
      cluster:
        cluster_compute: release_test_compute_cpu_aws.yaml

      run:
        script: python load_file_benchmark.py --device cpu

    - __suffix__: gpu
      cluster:
        cluster_compute: release_test_compute_gpu_aws.yaml

      run:
        script: python load_file_benchmark.py --device cuda

###############
# Data tests
###############

- name: cpu_job_autoscaling_benchmark
  group: data-tests
  working_dir: anyscale/data

  frequency: nightly
  team: data
  cluster:
    byod:
      type: gpu
    cluster_compute: cpu_job_autoscaling_benchmark_compute.yaml

  run:
    timeout: 3600
    script: python cpu_job_autoscaling_benchmark.py

- name: "checkpoint_benchmark_{{scale}}_{{id_column}}"
  group: data-tests
  working_dir: anyscale/data

  matrix:
    setup:
      scale: [small, large]
      id_column: [default_id, generated_id_column]

  frequency: nightly
  team: data
  cluster:
    byod:
      type: gpu
    cluster_compute: "checkpoint_benchmark_compute_{{scale}}.yaml"

  run:
    timeout: 4800
    script: python ./run_checkpoint_benchmark.py {{scale}} {{id_column}}

###############
# Rllib tests
###############

- name: rllib_multi_node_e2e_training_test
  group: RLlib tests
  working_dir: rllib_tests

  # Quoting sven: "a really old test case that should have been removed some time ago"
  # So mark this test as not auto running.
  #
  # TODO(aslonnie, sven): to be removed after getting final
  # confirmation from sven.
  frequency: manual
  team: rllib
  cluster:
    byod:
      type: gpu
      post_build_script: byod_rllib_test.sh
      runtime_env:
        - RLLIB_TEST_NO_JAX_IMPORT=1
        - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/home/ray/.mujoco/mujoco210/bin
    cluster_compute: multi_node_ckpt_training_compute_config.yaml

  run:
    timeout: 3600
    script: pytest multinode_training_checkpointing_tests/smoke_test_basic_multi_node_training_learner.py

    wait_for_nodes:
      num_nodes: 2

  alert: default

  variations:
    - __suffix__: aws
    - __suffix__: gce
      env: gce
      frequency: manual
      cluster:
        cluster_compute: multi_node_ckpt_training_compute_config_gce.yaml

###############
# Train tests
###############
- name: train_elastic_e2e_with_node_killing
  group: Train tests
  working_dir: anyscale/train/elastic_e2e

  frequency: weekly
  team: ml

  cluster:
    byod:
      type: gpu
    cluster_compute: compute_gpu_aws.yaml

  run:
    timeout: 4800
    script: RAY_TRAIN_V2_ENABLED=1 python torch_elastic_e2e.py run --num-epochs 60

    wait_for_nodes:
      num_nodes: 1

  variations:
    - __suffix__: aws

  alert: default

- name: elastic_benchmark
  group: Train tests
  working_dir: train_tests/benchmark

  frequency: weekly
  team: ml

  cluster:
    byod:
      type: gpu
    cluster_compute: compute_configs/compute_gpu_8x4_aws.yaml

  run:
    timeout: 7200
    script: RAY_TRAIN_V2_ENABLED=1 python -m rayturbo.elastic_e2e --task="image_classification" --image_classification_data_format="parquet" --dataloader_type=ray_data --checkpoint_every_n_steps=100 --min_workers=8 --max_workers=32 --num_epochs=4

    wait_for_nodes:
      num_nodes: 1

  variations:
    - __suffix__: aws

  alert: default

- name: "mid_epoch_resume_benchmark_{{scale}}"
  group: Train tests
  working_dir: anyscale/train/mid_epoch_resume_benchmark

  matrix:
    setup:
      scale: [10M, 3B]

  frequency: nightly
  team: data
  cluster:
    byod:
      type: gpu
    cluster_compute: "compute_configs/{{scale}}.yaml"

  run:
    timeout: 2700
    script: RAY_TRAIN_V2_ENABLED=1 python microbenchmark.py --num_rows={{scale}} --generate_id_column --error_at=0.9 --num_epochs=1


- name: training_ingest_benchmark-task=image_classification
  group: Train tests
  working_dir: train_tests/benchmark

  frequency: nightly
  team: ml

  cluster:
    byod:
      type: gpu
    cluster_compute: compute_configs/compute_mock_gpu_4x4_aws.yaml

  variations:
    - __suffix__: skip_batches_baseline
      run:
        timeout: 1800
        script: RAY_TRAIN_V2_ENABLED=1 python -m rayturbo.mid_epoch_resume --task=image_classification --dataloader_type=ray_data --num_workers=16 --mock_gpu --skip_train_step --skip_validation_at_epoch_end --image_classification_data_format=parquet --skip_batches_upon_resume

    - __suffix__: mid_epoch_resume
      run:
        timeout: 1800
        script: RAY_TRAIN_V2_ENABLED=1 python -m rayturbo.mid_epoch_resume --task=image_classification --dataloader_type=ray_data --num_workers=16 --mock_gpu --skip_train_step --skip_validation_at_epoch_end --image_classification_data_format=parquet


###############
# Core tests
###############
- name: core_nodes_scale_test
  group: core-scalability-test
  working_dir: anyscale/core

  frequency: monthly
  team: core

  cluster:
    byod:
      type: gpu
      runtime_env:
        - RAY_worker_register_timeout_seconds=360
        - RAY_gcs_rpc_server_connect_timeout_s=60
    cluster_compute: core_nodes_scale_compute.yaml
  run:
    timeout: 3600
    script: python core_nodes_scale_test.py --target_num_nodes 8000 --time_to_run_after_target_num_nodes 300
    wait_for_nodes:
      num_nodes: 1

  variations:
    - __suffix__: aws
