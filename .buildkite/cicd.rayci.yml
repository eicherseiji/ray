group: reef tests
steps:
  - label: ":test_tube: test-rules: premerge/postmerge"
    key: test-rules-premerge-postmerge
    commands:
      - export RAYCI_TEST_RULE_FILES=anyscale/ci/buildkite/test_rules_always.txt,anyscale/ci/buildkite/test_rules.txt,ci/pipeline/test_rules.txt &&
        curl -sfL "https://raw.githubusercontent.com/ray-project/rayci/stable/run_rayci.sh" | bash -s -- test-rules
        anyscale/ci/buildkite/test_rules_test.txt
    instance_type: small
    depends_on: forge
    tags: tools
  - label: ":test_tube: test-rules: macos"
    key: test-rules-macos
    commands:
      - export RAYCI_TEST_RULE_FILES=anyscale/ci/buildkite/test_rules_always.txt,ci/pipeline/test_rules.txt &&
        curl -sfL "https://raw.githubusercontent.com/ray-project/rayci/stable/run_rayci.sh" | bash -s -- test-rules
        .buildkite/macos/test_rules_macos_test.txt
    instance_type: small
    depends_on: forge
    tags: tools
  - label: ":coral: reef: ci+release tooling tests"
    key: reef-tests
    commands:
      - bazel run //ci/ray_ci:test_in_docker --
          //ci/ray_ci/... //release/... //ci/pipeline/... ci
          --only-tags=release_unit,ci_unit
          --cache-test-results --parallelism-per-worker 2
          --build-name oss-ci-base_test-py3.10
          --build-type skip
    instance_type: small
    depends_on:
      - oss-ci-base_test-multipy
      - forge
    tags: tools
  - label: ":coral: reef: raydepsets tests"
    key: raydepsets-tests
    commands:
      - bazel run //ci/ray_ci:test_in_docker --
          //ci/raydepsets/... ci
          --cache-test-results
          --build-name oss-ci-base_test-py3.10
          --build-type skip
    instance_type: small
    depends_on:
      - oss-ci-base_test-multipy
      - forge
    tags: tools
  - label: ":coral: reef: privileged container tests"
    commands:
      - bazel run //ci/ray_ci:test_in_docker --
          //ci/ray_ci:test_privileged ci
          --cache-test-results
          --build-name oss-ci-base_test-py3.10
          --build-type cgroup
          --privileged
    instance_type: small
    depends_on:
      - oss-ci-base_test-multipy
      - forge
    tags: tools
  - label: ":coral: reef: iwyu tests"
    commands:
      - bazel test --config iwyu //bazel/tests/cpp:example_test
    instance_type: small
    depends_on: oss-ci-base_build-multipy
    job_env: oss-ci-base_build-py3.10
    tags: tools
